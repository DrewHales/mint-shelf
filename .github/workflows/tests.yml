name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The virtual display has no desktop accessibility bus.
      NO_AT_BRIDGE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-3.0 xvfb xauth
      - name: Run storage, preferences and clipboard tests
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
